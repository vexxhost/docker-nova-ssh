name: image

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - uses: vexxhost/docker-atmosphere/.github/actions/build-image@d048c9245c93c10c06d42d1ea9311fcd3d416530 # main
        id: build
        with:
          image-name: nova-ssh
          push: ${{ github.event_name != 'pull_request' }}
          save: true

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1
      - uses: depot/pull-action@a913e06772c98ecd2361a8cc49bec81592dc6600 # v1
        with:
          build-id: ${{ needs.build.outputs.build-id }}
          tags: nova-ssh:test
      - uses: e1himself/goss-installation-action@8c646222c1cb43528392161394b745cb5d28e8f9 # v1
      - run: dgoss run nova-ssh:test sleep infinity
